<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔法検索システム</title>

<style>
  body {
    font-family: sans-serif;
    padding: 20px;
  }

  .tag, .add-tag, .edit-tag {
    margin: 4px;
    padding: 6px 12px;
    background: #eee;
    border: 1px solid #aaa;
    border-radius: 6px;
    cursor: pointer;
  }
  .selected {
    background: #333;
    color: white;
    border-color: #000;
  }

  .section {
    margin-bottom: 20px;
  }

  #adminArea, #editArea {
    display: none;
    padding: 15px;
    border: 1px solid #aaa;
    background: #f8f8f8;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<h1>魔法検索システム</h1>

<!-- ▼管理者ログイン -->
<div class="section">
  <h2>管理者ログイン</h2>
  <input id="adminPass" type="password" placeholder="管理者パスワード">
  <button onclick="loginAdmin()">ログイン</button>
  <span id="adminStatus"></span>
</div>

<!-- ▼管理者専用：魔法追加フォーム -->
<div id="adminArea">
  <h2>魔法追加（管理者専用）</h2>

  名前：<input id="add_name"><br><br>
  使用者：<input id="add_user"><br><br>
  効果：<textarea id="add_effect"></textarea><br><br>

  <h3>種族（複数選択）</h3>
  <div id="add_race_area"></div>

  <h3>属性（複数選択）</h3>
  <div id="add_element_area"></div>

  <h3>系統（複数選択）</h3>
  <div id="add_type_area"></div>

  <!-- ▼理環だけ単一選択 -->
  <h3>理環（単一選択）</h3>
  <select id="add_rank">
    <option value="第Ⅰ環">第Ⅰ環</option>
    <option value="第Ⅱ環">第Ⅱ環</option>
    <option value="第Ⅲ環">第Ⅲ環</option>
    <option value="第Ⅳ環">第Ⅳ環</option>
    <option value="第Ⅴ環">第Ⅴ環</option>
    <option value="第Ⅵ環">第Ⅵ環</option>
    <option value="第Ⅶ環">第Ⅶ環</option>
    <option value="第Ⅷ環">第Ⅷ環</option>
    <option value="第Ⅸ環">第Ⅸ環</option>
    <option value="第Ⅹ環">第Ⅹ環</option>
    <option value="第Ⅺ環">第Ⅺ環</option>
    <option value="第Ⅻ環">第Ⅻ環</option>
    <option value="その他">その他</option>
  </select>

  <br><br>
  <button onclick="addMagic()">追加する</button>
  <div id="addResult"></div>
</div>

<hr>

<!-- ▼キーワード検索 -->
<div class="section">
  <h2>キーワード検索</h2>
  <input id="keyword" type="text" style="width:300px;">
  <button onclick="filterMagic()">検索する</button>
</div>

<hr>

<!-- ▼選択検索（タグ） -->
<h2>選択検索</h2>

<!-- 種族 -->
<div class="section">
  <h3>種族</h3>
  <button class="tag" data-race="普人">普人</button>
  <button class="tag" data-race="半人">半人</button>
  <button class="tag" data-race="森人">森人</button>
  <button class="tag" data-race="獣人">獣人</button>
  <button class="tag" data-race="魚人">魚人</button>
  <button class="tag" data-race="竜人">竜人</button>
  <button class="tag" data-race="鬼人">鬼人</button>
  <button class="tag" data-race="亜人">亜人</button>
  <button class="tag" data-race="全種族">全種族</button>
</div>

<!-- 属性 -->
<div class="section">
  <h3>属性</h3>
  <button class="tag" data-element="火">火</button>
  <button class="tag" data-element="水">水</button>
  <button class="tag" data-element="氷">氷</button>
  <button class="tag" data-element="風">風</button>
  <button class="tag" data-element="地">地</button>
  <button class="tag" data-element="木">木</button>
  <button class="tag" data-element="雷">雷</button>
  <button class="tag" data-element="光">光</button>
  <button class="tag" data-element="闇">闇</button>
  <button class="tag" data-element="その他">その他</button>
</div>

<!-- 系統 -->
<div class="section">
  <h3>系統</h3>
  <button class="tag" data-type="奇跡">奇跡</button>
  <button class="tag" data-type="基礎">基礎</button>
  <button class="tag" data-type="汎用">汎用</button>
  <button class="tag" data-type="近接">近接</button>
  <button class="tag" data-type="遠隔">遠隔</button>
  <button class="tag" data-type="具現">具現</button>
  <button class="tag" data-type="信仰">信仰</button>
  <button class="tag" data-type="強化">強化</button>
  <button class="tag" data-type="治癒">治癒</button>
  <button class="tag" data-type="結界">結界</button>
  <button class="tag" data-type="妨害">妨害</button>
  <button class="tag" data-type="精神">精神</button>
  <button class="tag" data-type="音楽">音楽</button>
  <button class="tag" data-type="舞踊">舞踊</button>
  <button class="tag" data-type="環境">環境</button>
  <button class="tag" data-type="召喚">召喚</button>
  <button class="tag" data-type="操作">操作</button>
  <button class="tag" data-type="通信">通信</button>
  <button class="tag" data-type="捨象">捨象</button>
</div>

<!-- 理環（検索側は複数選択のまま） -->
<div class="section">
  <h3>理環</h3>
  <button class="tag" data-rank="第Ⅰ環">第Ⅰ環</button>
  <button class="tag" data-rank="第Ⅱ環">第Ⅱ環</button>
  <button class="tag" data-rank="第Ⅲ環">第Ⅲ環</button>
  <button class="tag" data-rank="第Ⅳ環">第Ⅳ環</button>
  <button class="tag" data-rank="第Ⅴ環">第Ⅴ環</button>
  <button class="tag" data-rank="第Ⅵ環">第Ⅵ環</button>
  <button class="tag" data-rank="第Ⅶ環">第Ⅶ環</button>
  <button class="tag" data-rank="第Ⅷ環">第Ⅷ環</button>
  <button class="tag" data-rank="第Ⅸ環">第Ⅸ環</button>
  <button class="tag" data-rank="第Ⅹ環">第Ⅹ環</button>
  <button class="tag" data-rank="第Ⅺ環">第Ⅺ環</button>
  <button class="tag" data-rank="第Ⅻ環">第Ⅻ環</button>
  <button class="tag" data-rank="その他">その他</button>
</div>

<hr>

<!-- ▼検索結果 -->
<div id="result"></div>

<!-- ▼編集フォーム -->
<div id="editArea">
  <h2>魔法編集（管理者専用）</h2>

  ID：<span id="edit_id"></span><br><br>
  名前：<input id="edit_name"><br><br>
  使用者：<input id="edit_user"><br><br>
  効果：<textarea id="edit_effect"></textarea><br><br>

  <h3>種族（複数選択）</h3>
  <div id="edit_race_area"></div>

  <h3>属性（複数選択）</h3>
  <div id="edit_element_area"></div>

  <h3>系統（複数選択）</h3>
  <div id="edit_type_area"></div>

  <h3>理環（単一選択）</h3>
  <select id="edit_rank">
    <option value="第Ⅰ環">第Ⅰ環</option>
    <option value="第Ⅱ環">第Ⅱ環</option>
    <option value="第Ⅲ環">第Ⅲ環</option>
    <option value="第Ⅳ環">第Ⅳ環</option>
    <option value="第Ⅴ環">第Ⅴ環</option>
    <option value="第Ⅵ環">第Ⅵ環</option>
    <option value="第Ⅶ環">第Ⅶ環</option>
    <option value="第Ⅷ環">第Ⅷ環</option>
    <option value="第Ⅸ環">第Ⅸ環</option>
    <option value="第Ⅹ環">第Ⅹ環</option>
    <option value="第Ⅺ環">第Ⅺ環</option>
    <option value="第Ⅻ環">第Ⅻ環</option>
    <option value="その他">その他</option>
  </select>

  <br><br>
  <button onclick="saveEdit()">保存する</button>
  <button onclick="deleteMagic()">削除する</button>
  <div id="editResult"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>

// Supabase 初期化（礼のプロジェクト情報を埋め込み済み）
const supabaseUrl = "https://cdgwvifyhknatufkrefz.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZ3d2aWZ5aGtuYXR1ZmtyZWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzE0NzAsImV4cCI6MjEwMjcwNzQ3MH0.fhkUVzhzd7s2kGnhWrxYeU5HoMjIV5N1Knk4kWkukus";

const client = supabase.createClient(supabaseUrl, supabaseKey);

// ▼タグ生成用データ
const races = ["普人","半人","森人","獣人","魚人","竜人","鬼人","亜人","全種族"];
const elements = ["火","水","氷","風","地","木","雷","光","闇","その他"];
const types = ["奇跡","基礎","汎用","近接","遠隔","具現","信仰","強化","治癒","結界","妨害","精神","音楽","舞踊","環境","召喚","操作","通信","捨象"];

// ▼管理者ログイン
window.loginAdmin = function() {
  const pass = document.getElementById("adminPass").value;

  if (pass === "ORCA!operator") {
    document.getElementById("adminArea").style.display = "block";
    document.getElementById("adminStatus").innerText = "ログイン成功";
  } else {
    document.getElementById("adminStatus").innerText = "パスワードが違います";
  }
}

// ▼追加フォームのタグ生成
function createAddTags() {
  const raceArea = document.getElementById("add_race_area");
  races.forEach(r => {
    const b = document.createElement("button");
    b.className = "add-tag";
    b.dataset.value = r;
    b.innerText = r;
    b.onclick = () => b.classList.toggle("selected");
    raceArea.appendChild(b);
  });

  const elementArea = document.getElementById("add_element_area");
  elements.forEach(e => {
    const b = document.createElement("button");
    b.className = "add-tag";
    b.dataset.value = e;
    b.innerText = e;
    b.onclick = () => b.classList.toggle("selected");
    elementArea.appendChild(b);
  });

  const typeArea = document.getElementById("add_type_area");
  types.forEach(t => {
    const b = document.createElement("button");
    b.className = "add-tag";
    b.dataset.value = t;
    b.innerText = t;
    b.onclick = () => b.classList.toggle("selected");
    typeArea.appendChild(b);
  });
}
createAddTags();

// ▼魔法追加
window.addMagic = async function() {
  const name = document.getElementById("add_name").value;
  const user = document.getElementById("add_user").value;
  const effect = document.getElementById("add_effect").value;

  const race = [...document.querySelectorAll("#add_race_area .add-tag.selected")].map(e => e.dataset.value);
  const element = [...document.querySelectorAll("#add_element_area .add-tag.selected")].map(e => e.dataset.value);
  const type = [...document.querySelectorAll("#add_type_area .add-tag.selected")].map(e => e.dataset.value);

  const rank = document.getElementById("add_rank").value;

  const { error } = await supabase
    .from("magic")
    .insert([{ name, user, effect, race, element, type, rank }]);

  document.getElementById("addResult").innerText =
    error ? "追加エラー：" + error.message : "追加しました！";
};

// ▼検索タグの選択
document.querySelectorAll(".tag").forEach(tag => {
  tag.onclick = () => tag.classList.toggle("selected");
});

// ▼魔法検索
window.filterMagic = async function() {
  const keyword = document.getElementById("keyword").value;

  const selectedRaces = [...document.querySelectorAll(".tag.selected[data-race]")]
    .map(e => e.dataset.race);

  const ignoreRace = selectedRaces.includes("全種族");

  const selectedElements = [...document.querySelectorAll(".tag.selected[data-element]")]
    .map(e => e.dataset.element);

  const selectedTypes = [...document.querySelectorAll(".tag.selected[data-type]")]
    .map(e => e.dataset.type);

  const selectedRanks = [...document.querySelectorAll(".tag.selected[data-rank]")]
    .map(e => e.dataset.rank);


  const { data } = await supabase.from("magic").select("*");

  const filtered = data.filter(row => {

    if (keyword) {
      const text = `${row.name}${row.user}${row.effect}`;
      if (!text.includes(keyword)) return false;
    }

    if (!ignoreRace && selectedRaces.length > 0) {
      if (!selectedRaces.some(r => (row.race || []).includes(r))) return false;
    }

    if (selectedElements.length > 0) {
      if (!selectedElements.some(e => (row.element || []).includes(e))) return false;
    }

    if (selectedTypes.length > 0) {
      if (!selectedTypes.some(t => (row.type || []).includes(t))) return false;
    }

    if (selectedRanks.length > 0) {
      if (!selectedRanks.includes(row.rank)) return false;
    }

    return true;
  });

  displayResult(filtered);
};

// ▼検索結果表示
function displayResult(list) {
  const area = document.getElementById("result");
  area.innerHTML = "";

  list.forEach(row => {
    const div = document.createElement("div");
    div.style.border = "1px solid #aaa";
    div.style.padding = "10px";
    div.style.margin = "10px 0";

    div.innerHTML = `
      <b>${row.name}</b><br>
      使用者：${row.user}<br>
      効果：${row.effect}<br>
      種族：${row.race.join(" / ")}<br>
      属性：${row.element.join(" / ")}<br>
      系統：${row.type.join(" / ")}<br>
      理環：${row.rank}<br>
      <button onclick="editMagic(${row.id})">編集</button>
    `;

    area.appendChild(div);
  });
}

// ▼編集フォームのタグ生成
function createEditTags() {
  const raceArea = document.getElementById("edit_race_area");
  races.forEach(r => {
    const b = document.createElement("button");
    b.className = "edit-tag";
    b.dataset.value = r;
    b.innerText = r;
    b.onclick = () => b.classList.toggle("selected");
    raceArea.appendChild(b);
  });

  const elementArea = document.getElementById("edit_element_area");
  elements.forEach(e => {
    const b = document.createElement("button");
    b.className = "edit-tag";
    b.dataset.value = e;
    b.innerText = e;
    b.onclick = () => b.classList.toggle("selected");
    elementArea.appendChild(b);
  });

  const typeArea = document.getElementById("edit_type_area");
  types.forEach(t => {
    const b = document.createElement("button");
    b.className = "edit-tag";
    b.dataset.value = t;
    b.innerText = t;
    b.onclick = () => b.classList.toggle("selected");
    typeArea.appendChild(b);
  });
}
createEditTags();

// ▼編集開始
window.editMagic = async function(id) {
  const { data } = await supabase.from("magic").select("*").eq("id", id).single();

  document.getElementById("edit_id").innerText = id;
  document.getElementById("edit_name").value = data.name;
  document.getElementById("edit_user").value = data.user;
  document.getElementById("edit_effect").value = data.effect;

  document.querySelectorAll("#edit_race_area .edit-tag").forEach(b => {
    b.classList.toggle("selected", data.race.includes(b.dataset.value));
  });

  document.querySelectorAll("#edit_element_area .edit-tag").forEach(b => {
    b.classList.toggle("selected", data.element.includes(b.dataset.value));
  });

  document.querySelectorAll("#edit_type_area .edit-tag").forEach(b => {
    b.classList.toggle("selected", data.type.includes(b.dataset.value));
  });

  document.getElementById("edit_rank").value = data.rank;

  document.getElementById("editArea").style.display = "block";
};

// ▼編集保存
window.saveEdit = async function() {
  const id = document.getElementById("edit_id").innerText;

  const name = document.getElementById("edit_name").value;
  const user = document.getElementById("edit_user").value;
  const effect = document.getElementById("edit_effect").value;

  const race = [...document.querySelectorAll("#edit_race_area .edit-tag.selected")].map(e => e.dataset.value);
  const element = [...document.querySelectorAll("#edit_element_area .edit-tag.selected")].map(e => e.dataset.value);
  const type = [...document.querySelectorAll("#edit_type_area .edit-tag.selected")].map(e => e.dataset.value);

  const rank = document.getElementById("edit_rank").value;

  const { error } = await supabase
    .from("magic")
    .update({ name, user, effect, race, element, type, rank })
    .eq("id", id);

  document.getElementById("editResult").innerText =
    error ? "保存エラー：" + error.message : "保存しました！";

  if (!error) {
    document.getElementById("editArea").style.display = "none";
  }
};

// ▼削除
window.deleteMagic = async function() {
  const id = document.getElementById("edit_id").innerText;

  const { error } = await supabase.from("magic").delete().eq("id", id);

  document.getElementById("editResult").innerText =
    error ? "削除エラー：" + error.message : "削除しました！";

  if (!error) {
    document.getElementById("editArea").style.display = "none";
  }
};

</script>
</body>
</html>
