<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔法管理・検索システム（Supabase＋管理者権限＋編集機能）</title>

<style>
body { font-family: sans-serif; padding: 20px; }

/* DBD風タグボタン */
.tag-btn {
  display: inline-block;
  padding: 6px 12px;
  margin: 4px;
  border: 1px solid #888;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
}
.tag-btn.active {
  background-color: #4caf50;
  color: white;
}

/* 魔法表示 */
.magic-item {
  border: 1px solid #ccc;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
}
</style>
</head>
<body>

<h2>魔法管理・検索システム（Supabase版）</h2>

<!-- ▼管理者ログイン -->
<h3>管理者ログイン</h3>
管理者パスワード：  
<input id="admin_pass" type="password">
<button onclick="adminLogin()">ログイン</button>

<hr>

<!-- ▼魔法追加・編集フォーム（管理者のみ表示） -->
<div id="admin_area" style="display:none;">

<h3 id="form_title">魔法を追加する（管理者専用）</h3>

魔法名：<br>
<input id="add_name" type="text" style="width:300px;"><br><br>

使用者名：<br>
<input id="add_user" type="text" style="width:300px;"><br><br>

説明文：<br>
<textarea id="add_effect" style="width:300px; height:80px;"></textarea><br><br>

<!-- ▼種族タグ -->
<h4>種族</h4>
<div id="race-tags">
  <span class="tag-btn" onclick="toggleTag(this)">普人</span>
  <span class="tag-btn" onclick="toggleTag(this)">半人</span>
  <span class="tag-btn" onclick="toggleTag(this)">森人</span>
  <span class="tag-btn" onclick="toggleTag(this)">獣人</span>
  <span class="tag-btn" onclick="toggleTag(this)">魚人</span>
  <span class="tag-btn" onclick="toggleTag(this)">竜人</span>
  <span class="tag-btn" onclick="toggleTag(this)">鬼人</span>
  <span class="tag-btn" onclick="toggleTag(this)">亜人</span>
</div>

<!-- ▼理環タグ -->
<h4>理環</h4>
<div id="rank-tags">
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅰ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅱ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅲ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅳ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅴ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅵ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅶ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅷ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅸ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅹ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅺ環</span>
  <span class="tag-btn" onclick="toggleTag(this)">第Ⅻ環</span>
</div>

<!-- ▼系統タグ -->
<h4>系統（魔法律）</h4>
<div id="type-tags">
  <span class="tag-btn" onclick="toggleTag(this)">奇跡</span>
  <span class="tag-btn" onclick="toggleTag(this)">基礎</span>
  <span class="tag-btn" onclick="toggleTag(this)">汎用</span>
  <span class="tag-btn" onclick="toggleTag(this)">近接</span>
  <span class="tag-btn" onclick="toggleTag(this)">遠隔</span>
  <span class="tag-btn" onclick="toggleTag(this)">具現</span>
  <span class="tag-btn" onclick="toggleTag(this)">信仰</span>
  <span class="tag-btn" onclick="toggleTag(this)">強化</span>
  <span class="tag-btn" onclick="toggleTag(this)">治癒</span>
  <span class="tag-btn" onclick="toggleTag(this)">結界</span>
  <span class="tag-btn" onclick="toggleTag(this)">妨害</span>
  <span class="tag-btn" onclick="toggleTag(this)">精神</span>
  <span class="tag-btn" onclick="toggleTag(this)">音楽</span>
  <span class="tag-btn" onclick="toggleTag(this)">舞踊</span>
  <span class="tag-btn" onclick="toggleTag(this)">環境</span>
  <span class="tag-btn" onclick="toggleTag(this)">召喚</span>
  <span class="tag-btn" onclick="toggleTag(this)">操作</span>
  <span class="tag-btn" onclick="toggleTag(this)">通信</span>
  <span class="tag-btn" onclick="toggleTag(this)">捨象</span>
</div>

<!-- ▼属性タグ -->
<h4>属性</h4>
<div id="element-tags">
  <span class="tag-btn" onclick="toggleTag(this)">火</span>
  <span class="tag-btn" onclick="toggleTag(this)">水</span>
  <span class="tag-btn" onclick="toggleTag(this)">氷</span>
  <span class="tag-btn" onclick="toggleTag(this)">風</span>
  <span class="tag-btn" onclick="toggleTag(this)">地</span>
  <span class="tag-btn" onclick="toggleTag(this)">木</span>
  <span class="tag-btn" onclick="toggleTag(this)">雷</span>
  <span class="tag-btn" onclick="toggleTag(this)">光</span>
  <span class="tag-btn" onclick="toggleTag(this)">闇</span>
  <span class="tag-btn" onclick="toggleTag(this)">その他</span>
</div>

<br>
<button onclick="saveMagic()">保存する</button>

</div><!-- admin_area -->

<hr>

<!-- ▼検索 -->
<h3>魔法を検索する</h3>

キーワード検索：<br>
<input id="keyword" type="text" style="width:300px;"><br><br>

<button onclick="filterMagic()">検索する</button>

<hr>

<!-- ▼検索結果 -->
<div id="result"></div>

<!-- ▼Supabase接続 -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabaseUrl = "https://cdgwvifyhknatufkrefz.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZ3d2aWZ5aGtuYXR1ZmtyZWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzE0NzAsImV4cCI6MjEwMjcwNzQ3MH0.fhkUVzhzd7s2kGnhWrxYeU5HoMjIV5N1Knk4kWkukus";
const supabase = createClient(supabaseUrl, supabaseKey);

let isAdmin = false;
let editingId = null;

/* ▼管理者ログイン */
window.adminLogin = function() {
  const pass = document.getElementById("admin_pass").value;

  if (pass === "ORCA!operator") {
    isAdmin = true;
    document.getElementById("admin_area").style.display = "block";
    alert("管理者ログイン成功");
  } else {
    alert("パスワードが違います");
  }
};

/* タグボタンのON/OFF */
window.toggleTag = function(btn) {
  btn.classList.toggle("active");
};

/* 選択されたタグを取得 */
function getSelectedTags(id) {
  return [...document.getElementById(id).querySelectorAll(".active")]
    .map(btn => btn.textContent);
}

/* ▼タグを編集モードに合わせてセット */
function resetTags(id, csv) {
  const list = csv.split(",");
  document.getElementById(id).querySelectorAll(".tag-btn").forEach(btn => {
    if (list.includes(btn.textContent)) {
      btn.classList.add("active");
    } else {
      btn.classList.remove("active");
    }
  });
}

/* ▼魔法編集モードに入る */
window.editMagic = async function(id) {
  const { data } = await supabase.from("magic").select("*").eq("id", id).single();

  editingId = id;
  document.getElementById("form_title").textContent = "魔法を編集する（管理者専用）";

  document.getElementById("add_name").value = data.name;
  document.getElementById("add_user").value = data.user;
  document.getElementById("add_effect").value = data.effect;

  resetTags("race-tags", data.race);
  resetTags("rank-tags", data.rank);
  resetTags("type-tags", data.type);
  resetTags("element-tags", data.element);

  alert("編集モードに入りました");
};

/* ▼魔法保存（追加 or 編集） */
window.saveMagic = async function() {
  if (!isAdmin) {
    alert("管理者のみ保存できます");
    return;
  }

  const race = getSelectedTags("race-tags");
  const rank = getSelectedTags("rank-tags");
  const type = getSelectedTags("type-tags");
  const element = getSelectedTags("element-tags");

  const magicData = {
    name: document.getElementById("add_name").value,
    user: document.getElementById("add_user").value,
    effect: document.getElementById("add_effect").value,
    race: race.join(","),
    rank: rank.join(","),
    type: type.join(","),
    element: element.join(",")
  };

  if (editingId) {
    await supabase.from("magic").update(magicData).eq("id", editingId);
    alert("魔法を編集しました！");
    editingId = null;
    document.getElementById("form_title").textContent = "魔法を追加する（管理者専用）";
  } else {
    await supabase.from("magic").insert(magicData);
    alert("魔法を追加しました！");
  }

  filterMagic();
};

/* ▼魔法削除（管理者のみ） */
window.deleteMagic = async function(id) {
  if (!isAdmin) {
    alert("管理者のみ削除できます");
    return;
  }

  await supabase.from("magic").delete().eq("id", id);
  alert("削除しました");
  filterMagic();
};

/* ▼検索処理 */
window.filterMagic = async function() {
  const keyword = document.getElementById("keyword").value.toLowerCase();

  const { data: magicList } = await supabase.from("magic").select("*");

  const race = getSelectedTags("race-tags");
  const rank = getSelectedTags("rank-tags");
  const type = getSelectedTags("type-tags");
  const element = getSelectedTags("element-tags");

  const result = magicList.filter(m => {
    const matchRace = race.length === 0 || race.some(r => m.race.includes(r));
    const matchRank = rank.length === 0 || rank.some(r => m.rank.includes(r));
    const matchType = type.length === 0 || type.some(t => m.type.includes(t));
    const matchElement = element.length === 0 || element.some(e => m.element.includes(e));

    const matchKeyword =
      !keyword ||
      m.name.toLowerCase().includes(keyword) ||
      m.user.toLowerCase().includes(keyword) ||
      m.effect.toLowerCase().includes(keyword);

    return matchRace && matchRank && matchType && matchElement && matchKeyword;
  });

  display(result);
};

/* ▼検索結果表示（管理者は編集・削除ボタンが出る） */
function display(list) {
  const area = document.getElementById("result");
  area.innerHTML = "";

  list.forEach(m => {
    area.innerHTML += `
      <div class="magic-item">
        <strong>${m.name}</strong><br>
        使用者: ${m.user}<br>
        種族: ${m.race}<br>
        理環: ${m.rank}<br>
        系統: ${m.type}<br>
        属性: ${m.element}<br>
        効果: ${m.effect}<br>
        ${isAdmin ? `
          <button onclick="editMagic('${m.id}')">編集</button>
          <button onclick="deleteMagic('${m.id}')">削除</button>
        ` : ""}
      </div>
    `;
  });
}
</script>

</body>
</html>
